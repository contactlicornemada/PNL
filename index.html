"2":["Un comportement peut avoir des conséquences différentes selon le contexte.","Demande-toi : « Dans quelle situation cette caractéristique pourrait-elle être utile ? » Ne cherche pas à justifier tous les comportements : certains restent problématiques.",["Positionner selon le contexte d'usage : un petit ordinateur est limité pour certains usages, idéal en déplacement.","Une grande prudence aide pour un investissement risqué, mais gêne pour une décision réversible.","Repérer où sa minutie est un atout et où elle le ralentit.","Adapter le niveau de détail : réunion technique ou grand public.","La réserve d'une personne peut refléter le contexte, sans prouver un intérêt."]],
"3":["Dans un modèle classique, on sépare un comportement indésirable de la fonction qu'il remplit, puis on cherche d'autres façons d'y répondre. Les six étapes varient selon les versions.","1. Définir le comportement à modifier. 2. Explorer le besoin ou la fonction qu'il remplit. 3. Identifier d'autres réponses possibles. 4. Évaluer conséquences et faisabilité. 5. Choisir une alternative. 6. Prévoir un test concret et réévaluer.",["Comprendre pourquoi un prospect reporte : incertitude, budget ou risque perçu, puis répondre à la vraie objection.","Remplacer le défilement compulsif par une pause ou une activité qui répond au besoin de détente.","Explorer ce qu'une habitude lui apporte avant de proposer des alternatives.","Remplacer les interruptions par la prise de notes si elles servent à ne pas oublier une idée.","Si tu évites les conversations par peur du rejet, exprimer ton intérêt progressivement en respectant l'autre."]],
"4":["Rechercher le besoin qu'un comportement tente éventuellement de satisfaire, sans supposer que ce besoin est positif ni que le comportement est acceptable.","Remplace « Pourquoi est-ce que je fais n'importe quoi ? » par « Qu'est-ce que j'essaie d'obtenir ou d'éviter dans cette situation ? »",["Un client qui compare beaucoup les prix cherche peut-être à réduire le risque financier.","Explorer si la procrastination évite l'incertitude, la fatigue ou la peur de l'échec.","Chercher le besoin derrière un comportement défensif avant d'en discuter les conséquences.","Voir une question critique comme une demande possible de clarification.","Comprendre le besoin de sécurité ou de temps de l'autre, sans présumer ni insister."]],
"5":["Schémas de langage associés à Robert Dilts, pour examiner les liens entre une croyance, ses raisons et ses conséquences : redéfinition, conséquences, contre-exemple, analogie, changement de niveau d'abstraction.","Repère une affirmation, puis examine sa portée, ses preuves et ses exceptions au lieu de chercher une réplique automatique.",["« C'est cher » : comparer coût total, durée d'utilisation et alternatives, avec des données vérifiables.","« J'ai échoué une fois, donc je suis mauvais » : distinguer un résultat ponctuel d'un jugement global.","Demander quelles expériences soutiennent sa conclusion et s'il existe des exceptions.","Répondre à une objection en clarifiant les critères de décision plutôt qu'en contredisant.","Remplacer le débat par une question ouverte : « Qu'est-ce qui te ferait te sentir à l'aise ? »"]],
"6":["Donner un cadre de compréhension avant qu'une personne découvre une information ou vive une expérience.","Annonce le contexte, les objectifs et les limites d'une discussion avant de présenter le contenu.",["Expliquer à qui le produit convient (et ne convient pas) avant la démonstration.","Définir le résultat réaliste attendu d'une séance de travail avant de commencer.","Demander son accord et préciser que l'on explore, sans juger.","Annoncer les trois idées principales et la conclusion attendue.","Dire « J'aimerais apprendre à te connaître, sans pression » et laisser l'autre choisir."]],
"7":["Associer un signal (geste, mot, image, élément de l'environnement) à une expérience ou à un état émotionnel.","Rappelle-toi une expérience où tu te sentais compétent et calme, associe-la à un geste discret, répète, puis vérifie si le geste facilite réellement le rappel de cet état.",["Une identité visuelle cohérente liée à une expérience client agréable, sans promettre un déclic automatique.","Une routine de préparation avant une tâche difficile.","Identifier les circonstances où la personne se sent capable et comment les retrouver.","Respiration lente et phrase de préparation avant de parler.","Créer des moments partagés agréables, sans chercher à conditionner quelqu'un."]],
"8":["Associer plusieurs souvenirs ou ressources à un même signal.","Sélectionne plusieurs expériences positives distinctes, rappelle chacune puis associe-les au même geste. Observe si ce geste devient un rappel utile.",["Une marque aux associations cohérentes : fiabilité, simplicité, convivialité.","Réunir des expériences de courage, de créativité et de persévérance.","Recenser plusieurs réussites plutôt que s'appuyer sur un seul souvenir.","Une routine alliant posture, respiration et rappel d'une réussite.","Se préparer présent et détendu en se rappelant des échanges réussis, sans contrôler l'autre."]],
"9":["Organiser plusieurs états ou signaux dans une séquence pour faciliter le passage de l'un à l'autre.","Identifie une progression réaliste (tension → curiosité → concentration), accompagne-la de rappels ou d'actions concrètes et vérifie ce qui marche.",["Un parcours client progressif : découverte, compréhension, évaluation, décision.","Une routine de transition entre repos et travail.","Découper une tâche anxiogène en étapes de plus en plus accessibles.","Préparation, respiration, première phrase mémorisée, puis parole naturelle.","Passer du léger au personnel seulement si les deux se sentent à l'aise."]],
"10":["Dans certains protocoles, réduire l'influence d'une association émotionnelle indésirable en travaillant sur ses signaux et ses réponses.","Repère le déclencheur, observe ta réaction, teste une autre réponse dans une situation peu intense. Si la réaction est forte ou liée à un traumatisme, privilégie un accompagnement professionnel.",["Repérer ce qui crée de la méfiance dans un parcours d'achat et le corriger réellement.","Faire une pause avant de répondre à un message qui met en colère.","L'aider à reconnaître ses déclencheurs et à choisir sa réponse, avec son accord.","Faire une pause après une question déstabilisante.","Gérer son stress face à un silence, sans neutraliser les limites de l'autre."]],
"11":["Visualiser un espace symbolique associé à ses ressources pour se préparer à une situation exigeante.","Imagine un cercle au sol, rappelle-toi une expérience de confiance, puis imagine entrer dans ce cercle avant une tâche. Évalue ensuite ton comportement réel : la visualisation ne suffit pas.",["Se préparer à défendre une proposition avec des arguments vérifiables.","Un rituel mental avant une décision importante.","Lui faire identifier ses ressources avant une épreuve, s'il apprécie la visualisation.","Répéter mentalement une présentation avec une posture stable.","Se rappeler que l'objectif est de partager un moment, pas de réussir une performance."]],
"12":["Identifier un état utile (calme, curiosité, détermination) et les conditions qui facilitent son apparition.","Définis l'état recherché, repère les comportements qui l'accompagnent et construis une petite routine reproductible. L'état émotionnel ne doit pas être une condition obligatoire pour agir.",["Une curiosité analytique pour étudier un marché sans s'attacher à une idée.","Chercher les conditions de la concentration plutôt que compter sur la motivation.","Demander ce qui l'aide à se sentir soutenu ou capable.","Mobiliser la curiosité envers le public pour réduire la pression.","Cultiver une présence attentive et détendue plutôt que jouer un personnage."]],
"13":["Vivre mentalement une scène à la première personne (association) ou l'observer comme devant soi (dissociation).","Pour préparer une action, imagine-la de ton point de vue. Pour prendre du recul, observe la scène de l'extérieur. Compare les effets sans forcer une représentation inconfortable.",["Se mettre à la place du client, puis prendre du recul sur le parcours global.","Revoir un conflit en observateur pour séparer faits et interprétation.","Proposer d'examiner un événement de l'extérieur, seulement si cela lui convient.","Répéter du point de vue de l'orateur, puis juger la clarté en spectateur.","Imaginer l'échange de son point de vue, puis se demander comment il peut être reçu, sans prétendre lire l'autre."]],
"14":["Explorer comment agrandir ou réduire une représentation modifie l'expérience subjective.","Rappelle-toi une scène non traumatique, observe ce qui change si tu l'imagines plus petite ou éloignée. Tu peux aussi rendre plus visible un objectif positif.",["Agrandir l'objectif du client (le résultat voulu) plutôt que les caractéristiques du produit.","Réduire l'importance d'une erreur ponctuelle face à l'ensemble d'un projet.","Voir si une difficulté paraît plus gérable une fois découpée.","Donner plus de place au message qu'à une petite erreur de présentation.","Réduire l'enjeu d'une première rencontre : faire connaissance, pas décider de toute une relation."]],
"15":["Modifier des caractéristiques visuelles d'un souvenir ou d'une anticipation pour explorer l'effet subjectif.","Observe ton ressenti, change une seule caractéristique mentale, vérifie l'effet. Ne confonds pas ce changement avec la résolution du problème sous-jacent.",["Rendre un résultat concret grâce à une démonstration authentique plutôt qu'à des promesses abstraites.","Prendre de la distance avec une anticipation anxieuse et revenir aux informations disponibles.","Distinguer ce qui s'est produit de ce qu'il imagine pouvoir arriver.","Rendre plus présente l'image de l'objectif que celle du jugement du public.","Prendre du recul face à un message ambigu ; demander une clarification si besoin."]],
"16":["Exercice qui remplace rapidement une représentation déclenchante par une image de soi adoptant une réponse souhaitée.","Identifie un déclencheur, définis une réaction alternative réaliste, imagine les deux représentations puis répète le passage de l'une à l'autre. Mesure ensuite si ton comportement change réellement.",["Imaginer le passage d'un parcours compliqué à un parcours simplifié, puis le vérifier auprès de vrais clients.","Passer de l'envie de procrastiner à une première action de deux minutes.","Préparer une réponse alternative à une situation répétitive, avec son accord.","Remplacer l'image de soi qui perd ses moyens par celle de soi qui fait une pause et reprend son fil.","Remplacer « je dois lui plaire » par « je vais découvrir si nous nous entendons »."]],
"17":["Imaginer une scène à travers plusieurs niveaux de représentation (se voir observer un film où l'on apparaît). Associée à des exercices sur des souvenirs pénibles ; ce n'est pas un traitement clinique validé.","Ne l'improvise pas pour un traumatisme ou une phobie importante. En version légère : observe une scène passée comme une séquence extérieure, reviens au présent et note ce que tu comprends autrement.",["Examiner une campagne en consommateur exposé et en analyste du message.","Observer un échange passé avec du recul, sans nier les émotions vécues.","Prendre du recul sur un désaccord ordinaire, en respectant ses limites.","Revoir une intervention pour distinguer la prestation réelle du jugement sur soi.","Analyser une interaction après coup pour apprendre, sans ruminer ni traiter l'autre en objet d'étude."]],
"18":["Clarifier sa propre expérience, ses besoins, ses émotions et ses limites.","Complète : « J'observe… », « Je ressens… », « J'ai besoin de… », « Je demande… ».",["Identifier précisément le problème client que ton offre résout.","Distinguer ses objectifs des attentes de l'entourage.","L'aider à dire ce qu'il veut lui-même, sans lui dicter ses choix.","Distinguer faits, opinions et demandes.","Exprimer son intérêt et ses limites honnêtement, sans contrôler la réaction de l'autre."]],
"19":["Essayer de comprendre comment l'autre peut vivre la situation, en reconnaissant que tu ne peux pas connaître son expérience à sa place.","Demande-toi ce qu'il sait, ce qu'il risque de perdre, ce qu'il pourrait souhaiter. Vérifie tes hypothèses en lui posant des questions.",["Comprendre risques, objections et critères de décision d'un acheteur.","Considérer comment tes paroles ont pu être reçues, sans supposer le pire.","Écouter son interprétation avant de proposer la tienne.","Adapter les explications au niveau et aux préoccupations du public.","Être attentif au confort et au consentement de l'autre ; le silence n'est pas un accord."]],
"20":["Examiner la situation comme un observateur extérieur, en cherchant faits, interprétations et intérêts de chacun.","Décris l'interaction sans adjectifs accusateurs, puis identifie ce qui est établi et ce qui reste une hypothèse.",["Analyser une campagne sans attribuer trop vite le résultat à une seule variable.","Évaluer un choix par ses conséquences plutôt que par son état émotionnel du moment.","Reformuler les deux versions d'un conflit sans désigner un coupable.","Examiner une discussion difficile pour trouver où est né le malentendu.","Vérifier la réciprocité par des comportements observables, sans fabriquer de certitude."]],
"21":["Faire dialoguer son point de vue, celui de l'autre et celui de l'observateur pour une compréhension plus complète.","Rédige trois descriptions distinctes, identifie leurs différences, puis formule une prochaine étape qui respecte les besoins et limites concernés.",["Faire correspondre objectifs de l'entreprise, expérience client et contraintes du marché.","Arbitrer entre envie immédiate, conséquences pour autrui et objectifs à long terme.","Explorer plusieurs lectures d'un conflit puis l'aider à choisir lui-même une action.","Préparer un argumentaire qui prend en compte l'orateur, le public et les faits.","Vérifier que les deux veulent la même chose, au-delà de l'attirance."]],
"22":["Modèle de questionnement visant à préciser les formulations vagues, les généralisations et les liens de causalité supposés.","Face à une affirmation floue, demande une précision concrète : « Toujours ? », « Qui précisément ? », « Sur quels faits te bases-tu ? »",["« C'est trop cher » → « Par rapport à quelle alternative, pour quel budget ? »","« Je rate tout » → « Quelles situations précises ? Qu'est-ce qui a marché ? »","Explorer ce que signifie « personne ne me respecte », sans invalider le ressenti.","Clarifier une demande ambiguë avant de répondre.","Demander « Prendre ton temps, qu'est-ce que cela signifie pour toi ? », si la personne veut en parler."]],
"23":["Structures linguistiques issues de l'hypnose ericksonienne : formulations ouvertes, suggestions, métaphores.","Emploie un langage évocateur qui laisse la liberté d'interpréter, au lieu d'imposer une expérience intérieure.",["« Imaginez comment cela pourrait simplifier votre quotidien » : se projeter sans promesse certaine.","« Je peux prendre le temps de découvrir quelle étape me convient. »","Des questions ouvertes qui laissent émerger ses propres idées.","Illustrer par une histoire ou une métaphore plutôt qu'une liste abstraite.","Une invitation ouverte : « On pourrait découvrir ce café ensemble si ça te dit »."]],
"24":["Éléments qu'une phrase tient implicitement pour acquis. « Quand souhaites-tu commencer ? » présuppose l'envie de commencer : utile si l'intention est établie, mais peut contourner un choix.","Repère ce que ta phrase suppose et vérifie que cette hypothèse est fondée avant de l'utiliser.",["« Quel format vous conviendrait ? » après confirmation que le prospect veut acheter.","« Quelle première étape pourrais-je essayer ? » quand tu as réellement décidé d'avancer.","« Quel soutien te serait utile ? » après lui avoir demandé s'il veut être accompagné.","Annoncer le plan en précisant l'objectif.","Proposer un café seulement si l'autre le souhaite ; sinon proposer simplement et accepter le refus."]],
"25":["Expliquer une idée à travers une autre situation qui lui ressemble sur certains aspects.","Choisis une analogie pertinente, précise ce qu'elle permet de comprendre et ses limites. Une métaphore éclaire, elle ne prouve pas.",["« Une assurance est un filet de sécurité », en précisant les garanties réelles.","« Une habitude, c'est un jardin » : de petites actions répétées.","Comparer une période difficile à une traversée, sans minimiser la souffrance.","Expliquer un système complexe par une image simple et mémorable.","Humour ou image partagée pour enrichir l'échange, sans jouer sur les émotions."]],
"26":["Dans son usage classique, deux messages ou exigences incompatibles sont reçus dans une relation où l'on ne peut guère les contester. Ce n'est pas simplement proposer deux options.","En communication saine, évite les injonctions contradictoires. Propose plutôt un choix réel entre deux possibilités acceptables, avec la possibilité de refuser.",["Proposer deux formats de démonstration, sans cacher la possibilité de ne pas poursuivre.","Choisir entre deux méthodes de travail adaptées plutôt que s'imposer une seule voie.","Proposer plusieurs options sans conditionner ton soutien à son choix.","Présenter deux voies en expliquant les compromis de chacune.","Proposer deux activités en acceptant un refus. Éviter les pièges rhétoriques."]],
"27":["Poser des questions qui réduisent l'ambiguïté et rendent une affirmation vérifiable.","Demande des exemples, des critères, une période, une quantité ou une définition.",["« Combien de temps prenez-vous pour traiter une commande ? »","« Quel résultat concret me ferait dire que cette semaine a été productive ? »","« Qu'est-ce qui te ferait dire que la situation s'est améliorée ? »","« Le projet est en retard : de combien de jours parle-t-on ? »","« Sorties tranquilles ou endroits animés ? » pour connaître une préférence réelle."]],
"28":["Passer d'un détail concret à une catégorie générale, ou inversement.","Quand la discussion devient trop abstraite, demande un exemple concret. Quand elle reste bloquée sur un détail, cherche le principe général qui le relie à l'objectif.",["De « le logiciel envoie des rappels » à « il réduit les oublis de rendez-vous », si les résultats le démontrent.","De « je dois répondre à cet e-mail » à « je veux entretenir des relations fiables ».","Partir d'un conflit précis pour trouver le besoin général de respect ou de reconnaissance.","Alterner une idée principale et un exemple concret.","Passer du léger aux valeurs quand l'échange devient naturellement personnel."]],
"29":["Représenter deux tendances intérieures comme des « parties » symboliques pour comprendre ce que chacune cherche à protéger ou obtenir.","Décris les deux tendances, leurs besoins, leurs risques et les solutions qui pourraient respecter les deux autant que possible.",["Arbitrer entre maximiser les ventes et protéger la confiance des clients.","Faire dialoguer la partie qui veut prendre des risques et celle qui veut la sécurité financière.","Explorer deux besoins contradictoires sans imposer de conclusion.","Concilier parler avec assurance et rester humble et précis.","Reconnaître à la fois l'envie de proximité et le besoin de préserver son rythme."]],
"30":["Rechercher une solution acceptable entre plusieurs objectifs intérieurs concurrents.","Pour chaque objectif, identifie le besoin protégé, les contraintes et un compromis possible. Teste ce compromis dans la réalité.",["Un compromis entre offre rentable et prix accessible pour une cible précise.","Organiser une semaine qui respecte travail, repos et relations sociales.","L'aider à trouver une option entre deux choix qu'il croit incompatibles.","Une proposition qui concilie les intérêts des différentes parties.","Un rythme de relation qui convient aux deux, sans qu'une seule personne fasse tous les compromis."]],
"31":["Exercice où l'on se déplace symboliquement entre positions liées à une croyance : croyance actuelle, doute, croyance souhaitée. Les étapes varient selon les protocoles.","Formule une croyance précise, examine ce qui la soutient, explore les objections, définis une croyance alternative réaliste, puis cherche des faits pour l'évaluer.",["Tester « les clients n'achèteront pas en ligne » par des expériences limitées et mesurables.","Examiner « je ne suis pas capable de parler en public » à partir de situations concrètes.","Distinguer une croyance héritée d'une conclusion tirée de ses propres expériences.","Remplacer « je dois convaincre tout le monde » par « j'expose clairement mes arguments ».","Remettre en question « si elle me plaît, je dois lui plaire » et accepter l'incertitude."]],
"32":["Revenir mentalement à une expérience passée qui aurait contribué à une croyance actuelle, puis explorer une autre interprétation et les ressources utiles.","Distingue les faits du souvenir, ce que tu en as conclu et ce que tu comprends aujourd'hui. La mémoire est reconstructive : les images mentales ne sont pas des preuves. Pour un traumatisme, fais appel à un professionnel qualifié.",["Examiner une ancienne mauvaise expérience d'achat pour comprendre une méfiance actuelle.","Réévaluer une erreur passée à la lumière de ce que tu savais alors.","L'écouter sans lui suggérer de souvenirs ni imposer une interprétation.","Dépasser une mauvaise présentation en identifiant les compétences acquises depuis.","Apprendre d'une relation passée sans supposer que chaque personne répétera les mêmes schémas."]],
"33":["Modèle de Robert Dilts : environnement, comportements, capacités, croyances et valeurs, identité et vision plus large. C'est une grille de réflexion, pas une hiérarchie scientifiquement établie.","Examine une difficulté à plusieurs niveaux et vérifie que l'objectif, les moyens et les contraintes sont cohérents.",["Vérifier que la promesse de la marque correspond au produit, aux capacités et aux pratiques.","Vérifier qu'une activité quotidienne correspond à tes valeurs et objectifs.","Voir si la difficulté vient des conditions, des compétences, des convictions ou d'un objectif flou.","Aligner message, exemples et comportement de l'orateur.","Vérifier la compatibilité des valeurs, attentes et comportements observables."]],
"34":["Étudier comment une personne réalise une tâche avec compétence, puis identifier ce qui peut être appris et reproduit.","Observe contexte, décisions, actions, retours et critères de réussite. Distingue le reproductible de ce qui tient à la personnalité ou aux circonstances.",["Décomposer une campagne performante et vérifier ce qui explique vraiment les résultats.","Étudier une période où tu travaillais bien pour retrouver les conditions favorables.","Lui faire identifier comment il a réussi une tâche similaire.","Analyser la structure d'une présentation efficace : intro, exemples, transitions, conclusion.","Observer les habitudes de relations saines (écoute, curiosité, réciprocité) sans copier une personnalité."]],
"35":["Exercice de visualisation et de préparation : imaginer une nouvelle réponse à une situation donnée, puis la tester.","Identifie une situation, définis le comportement souhaité, répète-le mentalement et prévois une mise en pratique réaliste.",["Simuler des réponses aux objections avant un entretien client.","Préparer une autre réponse à un déclencheur habituel de procrastination.","Répéter une conversation difficile avec lui, s'il le souhaite.","S'entraîner à reformuler puis répondre de façon structurée à une question imprévue.","Préparer une façon naturelle d'engager la conversation, sans script rigide."]],
"36":["Modèle de créativité en trois positions : le rêveur, le réaliste et le critique. Un exercice de génération et d'évaluation d'idées, pas une garantie de créativité.","Sépare les trois phases : produis d'abord des idées, transforme les plus prometteuses en plan concret, puis examine leurs faiblesses et améliore-les.",["Imaginer plusieurs campagnes, concevoir un test, puis analyser risques et mesures de réussite.","Explorer une ambition, la transformer en étapes, identifier les obstacles réels.","Explorer un projet sans critiquer trop tôt, puis examiner sa faisabilité.","Concevoir une présentation originale, la structurer, tester sa clarté.","Imaginer une activité à deux, vérifier sa faisabilité, s'assurer qu'elle intéresse l'autre."]],
"37":["Modèle cybernétique : tester l'état actuel, agir, tester à nouveau et arrêter lorsque le critère de sortie est satisfait.","Définis un objectif mesurable, choisis une action, compare le résultat au critère, ajuste si nécessaire et décide quand arrêter.",["Tester une publicité, mesurer le coût par résultat, modifier une variable, arrêter selon des critères préétablis.","Définir le résultat d'une séance, commencer, vérifier l'avancement, finir quand le critère est atteint.","Définir un objectif accessible, suivre les progrès, réviser le plan.","Répéter, mesurer durée et clarté, corriger jusqu'au niveau attendu.","Proposer, observer la réciprocité, adapter, s'arrêter si l'intérêt n'est pas partagé."]],
"38":["Catégories de préférences supposées dans le traitement de l'information et la décision (objectifs ou évitement des problèmes, nouveauté ou continuité). Ce ne sont pas des types de personnalité scientifiquement validés.","Traite ces catégories comme des hypothèses temporaires. Observe, pose des questions et adapte ton message aux préférences réellement exprimées.",["Montrer les gains possibles et les risques évités, selon les préoccupations du client.","Voir si tu es plus motivé par un objectif à atteindre ou un problème à résoudre.","Lui demander s'il préfère une vision globale ou des étapes détaillées.","Adapter niveau de détail et ordre des arguments au public.","Découvrir les préférences de l'autre par la conversation, sans lui coller d'étiquette."]]
};

let AC;const beep=(f,d=.1,t='sine',v=.12)=>{if(!M.snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
const vib=n=>{if(M.vib&&navigator.vibrate)navigator.vibrate(n)};
const win=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle'),i*90));
/* braises de fond */
const bg=$('bg'),bx=bg.getContext('2d');let em=[];
function rs(){bg.width=innerWidth;bg.height=innerHeight}rs();addEventListener('resize',rs);
const EC=['#ff5a1f','#ffb52e','#ffe27a','#ff3d6e','#ff9ab5'];
function mkE(init){return{x:Math.random()*innerWidth,y:init?Math.random()*innerHeight:innerHeight+10,v:.5+Math.random()*1.8,r:1+Math.random()*3.5,ph:Math.random()*6,c:EC[Math.floor(Math.random()*5)],a:.5+Math.random()*.5}}
for(let i=0;i<80;i++)em.push(mkE(true));
function fire(){bx.clearRect(0,0,bg.width,bg.height);bx.globalCompositeOperation='lighter';em.forEach((e,i)=>{e.y-=e.v;e.ph+=.03;e.x+=Math.sin(e.ph)*.6;const k=e.y/innerHeight;bx.globalAlpha=Math.max(0,e.a*Math.min(1,k*1.4));bx.fillStyle=e.c;bx.beginPath();bx.arc(e.x,e.y,e.r,0,6.3);bx.fill();if(e.y<-10)em[i]=mkE(false)});bx.globalCompositeOperation='source-over';requestAnimationFrame(fire)}fire();
/* confettis */
const cv=$('fx'),cx=cv.getContext('2d');let ps=[],run=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}size();addEventListener('resize',size);
function go(){if(!run){run=true;requestAnimationFrame(tick)}}
function burst(x,y,n=24,sp=7){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(.4+Math.random())*sp;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,c:COL[i%7],r:3+Math.random()*4,l:60+Math.random()*30,e:i%3==0?EM[i%4]:0})}go()}
function rain(){for(let i=0;i<80;i++)ps.push({x:Math.random()*innerWidth,y:-20-Math.random()*250,vx:Math.random()*2-1,vy:2+Math.random()*3,c:COL[i%7],r:4+Math.random()*4,l:150,e:i%4==0?EM[i%4]:0});go()}
function tick(){cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);ps=ps.filter(p=>p.l-->0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;cx.globalAlpha=Math.min(1,p.l/30);if(p.e){cx.font=p.r*4+'px serif';cx.fillText(p.e,p.x,p.y)}else{cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r*1.6,p.r)}});run=ps.length>0;if(run)requestAnimationFrame(tick)}
function floatTxt(t,x,y){const e=document.createElement('div');e.className='fl';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1100)}
const ctr=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
const shake=()=>{$('app').classList.remove('shk');void $('app').offsetWidth;$('app').classList.add('shk')};
let tq=[],tb=false;function toast(h){tq.push(h);if(!tb)nextT()}
function nextT(){const h=tq.shift();if(!h){tb=false;return}tb=true;$('toast').innerHTML=h;$('toast').classList.add('on');win();setTimeout(()=>{$('toast').classList.remove('on');setTimeout(nextT,450)},2200)}
const ACH=[['first','🗡️','Premier sang','Valide 1 utilisation',()=>uses()>=1],['m1','⭐','Première maîtrise','Maîtrise 1 technique',()=>mast()>=1],['m10','🔟','Décurion','Maîtrise 10 techniques',()=>mast()>=10],['m19','🥈','Mi-parcours','Maîtrise 19 techniques',()=>mast()>=19],['w1','🏅','Champion de niveau','Termine 1 niveau',()=>FAMILIES.some(famDone)],['w4','👑','Quadruple couronne','Termine 4 niveaux',()=>FAMILIES.filter(famDone).length>=4],['s3','🔥','Flamme vive','3 jours de série',()=>M.streak>=3],['all','🏛️','Légende de l\'arène','Maîtrise les 38',()=>mast()>=38]];
function checkAch(q){ACH.forEach(a=>{if(!M.ach[a[0]]&&a[4]()){M.ach[a[0]]=1;if(!q)toast(`${a[1]} Succès : ${a[2]}`)}})}
const lvl=()=>Math.floor(M.xp/200)+1;
function gain(xp,x,y){const l=lvl();M.xp+=xp;floatTxt(`+${xp} XP`,x,y);if(lvl()>l){toast(`⬆️ Rang ${lvl()} !<br><small>${TITLES[Math.min(lvl()-1,7)]}</small>`);rain()}hud()}
function hud(){const l=lvl();$('lv').textContent=l;$('ttl').textContent=`Rang ${l} · ${TITLES[Math.min(l-1,7)]} · ${M.xp%200}/200`;$('xpb').style.width=(M.xp%200)/2+'%';$('stk').textContent='🔥 '+M.streak;$('sp').textContent=`Rang ${l} · ${mast()} / 38 maîtrisées · série 🔥 ${M.streak}`}
function frontier(){for(const f of FAMILIES)for(let j=0;j<f.competences.length;j++)if(unl(f,j)&&!done(f.competences[j]))return[f,j]}
function build(){const map=$('map');map.innerHTML='';N={};S={};G={};W={};
map.insertAdjacentHTML('beforeend','<div class="sum"><div class="big1">🏛️</div><b class="cin">LE COLISÉE</b><small id="sumt">Atteins le sommet pour devenir légende !</small></div>');
for(let i=6;i>=0;i--){const f=FAMILIES[i],n=f.competences.length,H=(n+1)*ROW+30,w=document.createElement('div');w.className='world';w.style.setProperty('--c',COL[i]);
const e=f.grade.split(' ')[0],nm=f.grade.slice(e.length+1);
w.innerHTML=`<div class="wh"><span class="e">${e}</span><div class="t"><em>NIVEAU ${i+1}</em><b>${f.name}</b><small>${nm}</small><div class="bar"><i></i></div></div><b class="n2"></b></div>`;
const p=document.createElement('div');p.className='path';p.style.height=H+'px';
const sg=document.createElementNS(NS,'svg');sg.setAttribute('viewBox',`0 0 100 ${H}`);sg.setAttribute('preserveAspectRatio','none');p.appendChild(sg);
const X=j=>50+30*Math.sin(j*1.25+i),Y=j=>H-ROW*.6-j*ROW;
for(let j=0;j<=n;j++){const d=`M${j?X(j-1):50} ${j?Y(j-1):H}L${X(j)} ${Y(j)}`;['sb','sl'].forEach(k=>{const l=document.createElementNS(NS,'path');l.setAttribute('d',d);l.setAttribute('class',k);sg.appendChild(l);if(k=='sl')S[f.id+'_'+j]=l})}
for(let k=0;k<5;k++){const d=document.createElement('span');d.className='dc';d.textContent=DEC[(i*3+k)%8];d.style.cssText=`${k%2?'right':'left'}:-2%;top:${60+k*(H-120)/4}px;animation-delay:${k*.4}s`;p.appendChild(d)}
f.competences.forEach((c,j)=>{const b=document.createElement('button');b.className='n';b.style.cssText=`left:${X(j)}%;top:${Y(j)}px`;b.innerHTML=`<i class="b"></i><u class="ic">${e}</u><u class="fi">🔥</u><em class="st"></em>`;b.onclick=()=>openC(f,j);N[c.id]=b;p.appendChild(b)});
const g=document.createElement('button');g.className='n g';g.style.cssText=`left:${X(n)}%;top:${Y(n)}px`;g.innerHTML='<i class="b"></i>';g.onclick=()=>{vib(10);toast(`${f.grade}<br><small>${famDone(f)?'Niveau conquis !':'Termine tout le niveau'}</small>`)};G[f.id]=g;p.appendChild(g);
w.appendChild(p);map.appendChild(w);W[f.id]=w}
map.insertAdjacentHTML('beforeend','<div class="start"><div class="big1">🚪</div><b class="cin">PORTE DE L\'ARÈNE</b><small>⬆️ Ton ascension commence ici · Niveau 1</small></div>');refresh()}
function refresh(){FAMILIES.forEach(f=>{const nd=f.competences.filter(done).length,n=f.competences.length;
f.competences.forEach((c,j)=>{const b=N[c.id],u=unl(f,j)||done(c);b.className='n '+(u?(done(c)?'done':'avail'):'locked');
b.querySelector('.b').innerHTML=u?c.id:'🔒';b.querySelector('.st').textContent=u?(P[c.id]>0?'★':'☆')+(P[c.id]>1?'★':'☆'):'';S[f.id+'_'+j].classList.toggle('on',u)});
S[f.id+'_'+n].classList.toggle('on',nd==n);const g=G[f.id];g.className='n g '+(nd==n?'done':'locked');g.querySelector('.b').textContent=nd==n?'🏆':'🛡️';
W[f.id].querySelector('.bar i').style.width=nd/n*100+'%';W[f.id].querySelector('.n2').textContent=nd+'/'+n});
document.querySelectorAll('.av').forEach(e=>e.remove());const fr=frontier();if(fr){const a=document.createElement('div');a.className='av';a.textContent='🤺';N[fr[0].competences[fr[1]].id].appendChild(a)}
if(!fr&&$('sumt'))$('sumt').textContent='👑 VICTOIRE ! Tu es une légende de l\'arène !';
$('cta').style.display=fr?'':'none';hud()}
const sheet=h=>{$('sheet').innerHTML=h;$('veil').classList.add('on');$('sheet').classList.add('on')};
const close=()=>{$('veil').classList.remove('on');$('sheet').classList.remove('on')};$('veil').onclick=close;
function openC(f,j){const c=f.competences[j],i=FAMILIES.indexOf(f),n=P[c.id],u=unl(f,j)||done(c);vib(8);beep(520,.08);
let a='';if(!u)a=`<p>🔒 ${lockF(f)?`Tu ne peux pas sauter de niveau : termine d'abord le Niveau ${i} (${FAMILIES[i-1].grade}).`:`Maîtrise d'abord « ${f.competences[j-1].name} » (2 utilisations).`}</p>`;
else a=`<button class="big alt" id="lr">📖 APPRENDRE</button>`+(n>=2?'<p style="margin-top:10px">🏆 Technique maîtrisée !</p>':`<div class="rw" style="margin-top:10px"><span>+${n?100:50} XP</span></div><button class="big" id="use">⚔️ J'AI UTILISÉ !</button>`);
sheet(`<div class="cd" style="--c:${COL[i]}">${u?c.id:'🔒'}</div><div class="tag">Niveau ${i+1} · ${f.name}</div><h2>${c.name}</h2><p>${c.desc}</p><div class="stars"><span class="${n>0?'f':''}">★</span><span class="${n>1?'f':''}">★</span></div>${a}<button class="big gh" id="cl">Fermer</button>`);
$('cl').onclick=close;if($('lr'))$('lr').onclick=()=>learn(f,j);if($('use'))$('use').onclick=()=>{const[x,y]=ctr($('use'));use(f,j,x,y)}}
function learn(f,j){const c=f.competences[j],L=LEARN[c.id],i=FAMILIES.indexOf(f),n=P[c.id];beep(600,.08,'triangle');vib(8);
sheet(`<div class="cd" style="--c:${COL[i]}">${c.id}</div><div class="tag">Niveau ${i+1} · ${f.name}</div><h2>${c.name}</h2><div class="ln"><h3>💡 Idée de la famille</h3><p>${FI[i]}</p><h3>🎯 Principe</h3><p>${L[0]}</p><h3>🛠️ Mode d'emploi</h3><p>${L[1]}</p><h3>🌍 Applications</h3>${DOM.map((d,k)=>`<div class="dm"><span>${d[0]}</span><div><b>${d[1]}</b><br>${L[2][k]}</div></div>`).join('')}<p class="nt">Outil de réflexion et de communication, pas une loi démontrée du fonctionnement humain.</p></div>${n<2?`<button class="big" id="use">⚔️ J'AI UTILISÉ !</button>`:''}<button class="big gh" id="bk">← Retour</button>`);
$('sheet').scrollTop=0;$('bk').onclick=()=>openC(f,j);if($('use'))$('use').onclick=()=>{const[x,y]=ctr($('use'));use(f,j,x,y)};
if(!M.read)M.read={};if(!M.read[c.id]){M.read[c.id]=1;gain(10,innerWidth/2,innerHeight*.35);saveAll()}}
function use(f,j,x,y){const c=f.competences[j],b=N[c.id];P[c.id]++;const m=P[c.id]>=2;
combo=Date.now()-lastUse<30000?combo+1:1;lastUse=Date.now();gain((m?100:50)+Math.min(combo-1,5)*10,x,y);if(combo>1)setTimeout(()=>floatTxt('COMBO ×'+combo+' 🔥',x,y-40),200);
close();vib(m?[30,40,60]:15);m?win():beep(660,.1,'triangle');if(m)shake();
if(m&&famDone(f)){gain(300,x,y-60);toast(`🏆 Niveau ${FAMILIES.indexOf(f)+1} conquis !<br><small>${f.grade} · +300 XP</small>`);rain()}
refresh();checkAch();saveAll();b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),600);burst(...ctr(b),m?40:18);
if(m&&j<f.competences.length-1){const nb=N[f.competences[j+1].id];setTimeout(()=>{nb.scrollIntoView({block:'center',behavior:'smooth'});burst(...ctr(nb),12)},500)}}
function achS(){sheet('<h2>🏆 Succès</h2>'+ACH.map(a=>`<div class="ac ${M.ach[a[0]]?'on':''}"><span>${a[1]}</span><div><b>${a[2]}</b><small>${a[3]}</small></div></div>`).join('')+'<button class="big gh" id="cl">Fermer</button>');$('cl').onclick=close}
function optS(){sheet(`<h2>⚙️ Options</h2><div class="tg">🔊 Sons<button class="big gh" style="width:90px;margin:0;padding:8px" id="o1">${M.snd?'ON':'OFF'}</button></div><div class="tg">📳 Vibrations<button class="big gh" style="width:90px;margin:0;padding:8px" id="o2">${M.vib?'ON':'OFF'}</button></div><button class="big alt" id="o3">▶ Rejouer l'ascension</button><button class="big gh" id="o4" style="margin-top:14px">⟲ Tout réinitialiser</button><button class="big gh" id="cl" style="margin-top:14px">Fermer</button>`);
$('o1').onclick=()=>{M.snd=!M.snd;saveAll();optS()};$('o2').onclick=()=>{M.vib=!M.vib;saveAll();optS()};$('o3').onclick=()=>{close();replay()};
$('o4').onclick=()=>{if(confirm('Tout réinitialiser (progression, XP) ? Tu repartiras du niveau 1.')){FAMILIES.forEach(f=>f.competences.forEach(c=>P[c.id]=0));M.xp=0;M.ach={};saveAll();close();refresh();toBottom()}};$('cl').onclick=close}
$('nav').onclick=e=>{const t=e.target.closest('button')?.dataset.t;if(!t)return;beep(480,.06);vib(6);if(t=='ach')achS();if(t=='opt')optS()};
$('cta').onclick=()=>{const fr=frontier();if(!fr)return;N[fr[0].competences[fr[1]].id].scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>openC(fr[0],fr[1]),450)};
const toBottom=()=>scrollTo({top:document.documentElement.scrollHeight,behavior:'instant'});
function replay(){timers.forEach(clearTimeout);timers=[];busy=true;toBottom();
FAMILIES.forEach(f=>{f.competences.forEach(c=>{N[c.id].className='n locked pre'});G[f.id].className='n g locked pre'});document.querySelectorAll('.sl').forEach(e=>e.classList.remove('on'));
document.querySelectorAll('.av').forEach(e=>e.remove());
const st=[];FAMILIES.forEach(f=>f.competences.forEach((c,j)=>{if(done(c))st.push([f,c,j])}));const dt=Math.min(180,4500/Math.max(st.length,1));

setTimeout(()=>addEventListener('pointerdown',()=>{if(busy)skip()},{once:true}),400);

timers.push(setTimeout(()=>{b.className='n done pop';b.querySelector('.b').innerHTML=c.id;b.querySelector('.st').textContent='★★';beep(500+k*18,.07,'triangle');burst(...ctr(b),10,5);if(j==f.competences.length-1){S[f.id+'_'+(j+1)].classList.add('on');G[f.id].className='n g done';G[f.id].querySelector('.b').textContent='🏆'}},dt*.4))},k*dt)));

$('go').onclick=()=>{$('splash').classList.add('off');beep(660,.12,'triangle');vib(20);setTimeout(replay,250)};
checkAch(first);saveAll();build();toBottom();
</script></body></html>
